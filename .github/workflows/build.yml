name: Build CMCC PZ-L8 (NSS)

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'README.md', '**.md' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt tag or commit to build against'
        required: false
        default: 'v25.12.5'
      make_release:
        description: 'Publish a GitHub release with the images'
        type: boolean
        required: false
        default: true
      ssh_on_failure:
        description: 'Keep the runner alive for debugging if the build fails'
        type: boolean
        required: false
        default: false

env:
  OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'v25.12.5' }}
  TZ: Asia/Shanghai

# One build per branch. A newer push cancels the older run rather than racing
# it to the Releases page - both would publish with make_latest, and the loser
# of that race is whichever finishes second, not whichever is newer. Manual
# runs get their own group per run id so a push cannot cancel them.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    # Only the release step needs this, and without it GITHUB_TOKEN is
    # read-only by default and action-gh-release fails with 403.
    permissions:
      contents: write

    steps:
      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: pzl8-nss

      - name: Free up disk space
        run: |
          # An OpenWrt build needs well over the ~14 GB a stock runner leaves free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd libelf-dev
          sudo timedatectl set-timezone "$TZ" || true

      - name: Checkout OpenWrt ${{ env.OPENWRT_REF }}
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 0

      - name: Prepare the tree
        # No chmod here on purpose: git records setup.sh as 100755 and
        # actions/checkout preserves it, so if this ever fails with Permission
        # denied the repository has lost the bit and that is worth seeing.
        run: |
          pzl8-nss/scripts/setup.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Verify the expected packages are selected
        run: |
          cd openwrt
          missing=0
          for sym in \
            CONFIG_PACKAGE_kmod-qca-nss-drv \
            CONFIG_PACKAGE_kmod-qca-nss-ecm \
            CONFIG_PACKAGE_kmod-qca-mcs \
            CONFIG_PACKAGE_kmod-qca-nss-dp \
            CONFIG_PACKAGE_kmod-qca-ssdk \
            CONFIG_PACKAGE_nss-firmware-ipq50xx \
            CONFIG_NSS_DRV_WIFIOFFLOAD_ENABLE \
            CONFIG_NSS_FIRMWARE_VERSION_12_5
          do
            if grep -q "^${sym}=y" .config; then
              echo "  ok   $sym"
            else
              echo "  MISS $sym"; missing=1
            fi
          done
          [ "$missing" = 0 ] || { echo "config seed did not survive defconfig"; exit 1; }

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 V=s 2>&1 | grep -iE '^(Downloading|ERROR|.*failed)' || true
          # a zero-length download is a silent poison pill later in the build
          find dl -size -1024c -type f -print -delete || true

      - name: Build
        id: build
        run: |
          cd openwrt
          make -j$(nproc) || {
            echo "::warning::parallel build failed, retrying single-threaded for a readable log"
            make -j1 V=s
          }

      - name: Collect build metadata
        if: success()
        run: |
          cd openwrt
          {
            echo "openwrt_ref=$OPENWRT_REF"
            echo "openwrt_commit=$(git rev-parse --short HEAD)"
            echo "project_commit=$(git -C "$GITHUB_WORKSPACE/pzl8-nss" rev-parse --short HEAD)"
            echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } | tee "$GITHUB_WORKSPACE/build-info.txt"
          # Seconds, because this is the tag: at minute resolution two runs
          # finishing in the same minute ask GitHub for the same tag name.
          echo "DATE=$(date '+%Y%m%d_%H%M%S')" >> "$GITHUB_ENV"
          echo "FIRMWARE=$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommax/ipq50xx" >> "$GITHUB_ENV"

      - name: List what was produced
        if: success()
        run: ls -lh "$FIRMWARE" && cat openwrt/bin/targets/qualcommax/ipq50xx/*.manifest | head -40

      - name: Write the release notes
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          IPQ=openwrt/bin/targets/qualcommax/ipq50xx
          {
            echo "OpenWrt \`$OPENWRT_REF\` with Qualcomm NSS offload for the CMCC PZ-L8."
            echo
            echo "| file | use |"
            echo "|---|---|"
            echo "| \`*-squashfs-sysupgrade.bin\` | upgrading a router that already runs OpenWrt - \`sysupgrade -n\` |"
            echo "| \`*-squashfs-factory.ubi\` | writing from U-Boot / first install |"
            echo "| \`*-initramfs-uImage.itb\` | boots from RAM without touching flash, for recovery |"
            echo
            echo "Default LAN address is **192.168.10.1**. Flashing, including the"
            echo "U-Boot web recovery at 192.168.10.10, is in [docs/RECOVERY.md](docs/RECOVERY.md)."
            echo
            echo '```'
            cat build-info.txt
            echo '```'
            echo
            echo "sha256:"
            echo '```'
            grep -E 'sysupgrade\.bin|factory\.ubi|initramfs-uImage\.itb' $IPQ/sha256sums || cat $IPQ/sha256sums
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cmcc_pz-l8-nss_${{ env.DATE }}
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.ubi
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
            build-info.txt
          if-no-files-found: error

      # Every green build of main gets a release, because run artifacts expire
      # and need a login to fetch.  Pull requests do not, and a manual run can
      # opt out by unticking make_release.
      - name: Publish release
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.make_release == 'true'))
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: build-${{ env.DATE }}
          name: CMCC PZ-L8 NSS ${{ env.DATE }}
          body_path: release-notes.md
          make_latest: true
          files: |
            ${{ env.FIRMWARE }}/*-sysupgrade.bin
            ${{ env.FIRMWARE }}/*-factory.ubi
            ${{ env.FIRMWARE }}/*-initramfs-uImage.itb
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
          fail_on_unmatched_files: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            openwrt/logs/**
            openwrt/.config
          if-no-files-found: ignore
