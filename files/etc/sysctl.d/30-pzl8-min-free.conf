# OpenWrt's /etc/init.d/sysctl sets vm.min_free_kbytes to a flat 16384 for
# every board with more than 64 MB, whether it has 128 MB or 8 GB.  This one
# reports 173 MB of MemTotal - 83 MB of the 256 MB is reserved before Linux
# starts, 49 of that for the Q6 wireless firmware - so the flat figure is 9.5 %
# of usable RAM parked below the low watermark, and it is the whole of the gap
# between MemFree and MemAvailable.
#
# 8192 is still 4.7 %, which is generous for a router whose datapath is on the
# NSS cores and therefore does fewer atomic allocations in softirq than an
# ordinary one, not more.  Verified under saturating Wi-Fi: no page-allocation
# failures, no NSS drops.
#
# start() in that init script runs apply_defaults first and then reads this
# directory, so this wins.
vm.min_free_kbytes=8192
